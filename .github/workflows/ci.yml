name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Size and purity limits
        run: python3 tools/lint/check_limits.py .
      - name: Tool tests
        run: |
          python3 -m unittest discover -s tools/lint -p "test_*.py"
          python3 -m unittest discover -s tools/probe -p "test_*.py"
          python3 -m unittest discover -s tools/camshim -p "test_*.py"
          python3 -m unittest discover -s tools/microscope -p "test_*.py"
          python3 -m unittest discover -s tools/fusion -p "test_*.py"
          python3 -m unittest discover -s tools/calib -p "test_*.py"

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure and build
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/core --parallel
      - name: Test (negative controls must fail for ctest to pass)
        run: ctest --test-dir build/core --output-on-failure
      - name: Negative controls are present
        run: |
          n=$(ctest --test-dir build/core -N -L negative_control | sed -n 's/^Total Tests: //p')
          echo "negative controls: $n"
          test "$n" -ge 4

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install the pinned Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Build, unit-test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: No network permission
        run: |
          for apk in probe/build/outputs/apk/debug/probe-debug.apk microscope/build/outputs/apk/debug/microscope-debug.apk; do
            perms=$("$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions "$apk")
            echo "$perms"
            ! echo "$perms" | grep -q 'android.permission.INTERNET'
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-debug
          path: android/probe/build/outputs/apk/debug/probe-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microscope-debug
          path: android/microscope/build/outputs/apk/debug/microscope-debug.apk
